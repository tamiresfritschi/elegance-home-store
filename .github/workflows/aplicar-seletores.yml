name: Aplicar seletores de compra

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aplicar-seletores.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar seletores
        run: python .github/scripts/add_selectors.py
      - name: Publicar alteração
        run: |
          git config user.name "Elegance Home Bot"
          git config user.email "actions@github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git commit -m "Adicionar seletor de cor e tamanho"
            git push
          fi
