name: Adicionar Bege Acinzentado

on:
  push:
    paths:
      - '.github/workflows/add-bege-acinzentado.yml'

permissions:
  contents: write

jobs:
  atualizar-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Atualizar index
        run: python .github/scripts/add_bege_acinzentado.py
      - name: Salvar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária"
          else
            git commit -m "Adicionar Bege Acinzentado ao seletor"
            git push
          fi
